<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Athena</title>
  <!-- Tailwind CSS (via CDN as requested by the user's template) -->
  <script src="https://cdn.tailwindcss.com?plugins=container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#3B82F6",
            "primary-dark": "#2563EB",
            "primary-hover": "#2563eb",
            "secondary": "#60a5fa",
            "accent": "#93c5fd",
            "background-light": "#f0f4f8",
            "background-dark": "#0f172a",
            "surface-light": "#ffffff",
            "surface-dark": "#1e293b",
            "athena-blue": "#eff6ff",
            "athena-indigo": "#4F46E5",
            "athena-light": "#E0E7FF",
            "athena-soft": "#F5F8FF",
            "athena-accent": "#818CF8",
            "athena-text": "#1e293b",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"],
            "brand": ["Fredoka", "sans-serif"],
            "calendar": ["Nunito", "sans-serif"],
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "2xl": "2rem",
            "3xl": "2.5rem",
            "soft": "24px",
            "full": "9999px"
          },
          boxShadow: {
            "soft-xl": "0 20px 40px -5px rgba(0, 0, 0, 0.05), 0 10px 20px -5px rgba(0, 0, 0, 0.02)",
            "deep": "0 25px 50px -12px rgba(59, 130, 246, 0.15)",
            "soft": "0 10px 40px -10px rgba(0,0,0,0.08)",
            "soft-hover": "0 20px 40px -10px rgba(59, 130, 246, 0.15)",
            "glow": "0 0 20px rgba(59, 130, 246, 0.3)",
            "soft-glow": "0 10px 40px -10px rgba(79, 70, 229, 0.2)",
            "float": "0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01)"
          }
        },
      },
    }
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #bfdbfe;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #93c5fd;
    }

    .input-transition {
      transition: all 0.2s ease-in-out;
    }


    .bg-mesh {
      background-color: #ffffff;
      background-image:
        radial-gradient(at 0% 0%, hsla(217, 91%, 93%, 1) 0, transparent 50%),
        radial-gradient(at 50% 100%, hsla(202, 81%, 96%, 1) 0, transparent 50%),
        radial-gradient(at 100% 0%, hsla(220, 85%, 94%, 1) 0, transparent 50%);
    }

    .bg-pattern {
      background-color: #f0f4f8;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%233b82f6' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>

<body
  class="bg-mesh font-display text-athena-text min-h-screen flex flex-col antialiased selection:bg-blue-100 selection:text-blue-900">
  <div id="root" class="flex-grow flex flex-col h-full w-full"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
