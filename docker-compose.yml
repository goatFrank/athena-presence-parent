version: '3.8'

services:
  attendance-service:
    build:
      context: .
      dockerfile: attendance-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=dev
      # Environment variables can be fetched from your host system using ${ENV_VAR} syntax
      - DB_URL=${SUPABASE_DB_URL:-jdbc:postgresql://host.docker.internal:5432/postgres}
      - DB_USERNAME=${SUPABASE_DB_USERNAME:-postgres}
      - DB_PASSWORD=${SUPABASE_DB_PASSWORD:-postgres}
      - JWT_ISSUER=${SUPABASE_JWT_ISSUER}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    restart: unless-stopped
    networks:
      - athena-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_PROFILES_ACTIVE=dev
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    restart: unless-stopped
    networks:
      - athena-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # Useful for live-reloading inside Docker
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    volumes:
      - ./frontend:/app # Sync code for hot reload
      - /app/node_modules # Keep node_modules anonymous so host's doesn't override it
    depends_on:
      - attendance-service
      - auth-service
    restart: unless-stopped
    networks:
      - athena-network

networks:
  athena-network:
    driver: bridge
