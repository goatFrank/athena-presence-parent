version: '3.8'

services:
  attendance-service:
    build:
      context: .
      dockerfile: attendance-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=${SUPABASE_DB_URL}
      - DB_USERNAME=${SUPABASE_DB_USERNAME}
      - DB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - JWT_ISSUER=${SUPABASE_JWT_ISSUER}
      - SUPABASE_URL=${SUPABASE_URL}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - athena-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_PROFILES_ACTIVE=dev
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - athena-network

  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - athena-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # Useful for live-reloading inside Docker
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    volumes:
      - ./frontend:/app # Sync code for hot reload
      - /app/node_modules # Keep node_modules anonymous so host's doesn't override it
    depends_on:
      - attendance-service
      - auth-service
    restart: unless-stopped
    networks:
      - athena-network

networks:
  athena-network:
    driver: bridge
